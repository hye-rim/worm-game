<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지렁이 게임</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1b2a1b; color:#dfd; font-family:sans-serif; }
  canvas { background:#0e1a0e; border:4px solid #4a7; border-radius:8px; touch-action:none; }
  #info { margin:10px; font-size:18px; }
</style>
</head>
<body>
<div id="info">점수: <span id="score">0</span> · 최고: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<p>방향키/WASD/스와이프로 이동 · 스페이스바로 시작/재시작</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const N = 20, S = canvas.width / N;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
let best = +localStorage.getItem('wormBest') || 0;
bestEl.textContent = best;

let worm, dir, nextDir, food, score, timer, state = 'ready';

function reset() {
  worm = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0; scoreEl.textContent = 0;
  placeFood();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (worm.some(s => s.x===food.x && s.y===food.y));
}
function start() {
  reset(); state = 'play';
  clearInterval(timer); timer = setInterval(step, 130);
}
function step() {
  dir = nextDir;
  const h = {x:worm[0].x+dir.x, y:worm[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N || worm.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  worm.unshift(h);
  if (h.x===food.x && h.y===food.y) {
    score++; scoreEl.textContent = score; placeFood();
    clearInterval(timer); timer = setInterval(step, Math.max(60, 130 - score*3));
  } else worm.pop();
  draw();
}
function gameOver() {
  clearInterval(timer); state = 'over';
  if (score > best) { best = score; localStorage.setItem('wormBest', best); bestEl.textContent = best; }
  draw();
}
function text(msg, y, size) {
  ctx.fillStyle = '#fff'; ctx.font = `bold ${size}px sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(msg, canvas.width/2, y);
}
function draw() {
  ctx.fillStyle = '#0e1a0e'; ctx.fillRect(0,0,canvas.width,canvas.height);
  if (!worm) { text('🐛 지렁이 게임', 190, 28); text('아무 방향키나 클릭으로 시작', 230, 18); return; }
  ctx.fillStyle = '#e44'; ctx.beginPath();
  ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-3, 0, 7); ctx.fill();
  worm.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#9f6' : '#4b4';
    ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2);
  });
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    text('게임 오버', 190, 32); text('스페이스바로 재시작', 230, 18);
  }
}
function turn(x, y) {
  if (state !== 'play') return;
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
}
const keys = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (state !== 'play') start(); return; }
  const k = keys[e.key]; if (k) { e.preventDefault(); if (state !== 'play') start(); turn(...k); }
});
let t0;
canvas.addEventListener('touchstart', e => { t0 = e.touches[0]; if (state !== 'play') start(); });
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX-t0.clientX, dy = t.clientY-t0.clientY;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx),0) : turn(0,Math.sign(dy));
});
draw();
canvas.addEventListener('click', () => { if (state !== 'play') start(); });
</script>
</body>
</html>
