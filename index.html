<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>지렁이 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:12px; overscroll-behavior:none; user-select:none;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.08) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #7ed957 0%, #2fb35a 100%) fixed;
    color:var(--ink); font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }
  /* 판 크기: 화면 폭과 높이(점수줄·방향 버튼 자리를 뺀 만큼) 중 작은 쪽에 맞춘다 */
  :root { --board:min(400px, 92vw, calc(100dvh - 280px)); }
  #help .pc { display:none; }
  @media (pointer:fine) { #help .pc { display:inline; } #help .touch { display:none; } }
  @media (pointer:fine) { :root { --board:min(440px, 92vw, calc(100dvh - 140px)); } #pad { display:none !important; } }
  #info { display:flex; gap:10px; width:var(--board); min-width:260px; }
  #pauseBtn {
    flex:none; width:44px; height:40px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink);
    box-shadow:0 4px 0 var(--ink); font-size:16px; font-family:inherit; cursor:pointer;
  }
  #pauseBtn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .pill {
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:4px 14px; font-size:20px; font-variant-numeric:tabular-nums;
  }
  .pill.score { background:var(--yellow); flex:1; }
  .pill small { font-size:13px; color:#6b5c95; }
  canvas {
    width:var(--board); min-width:260px; height:auto; aspect-ratio:1; display:block;
    border-radius:22px; touch-action:none;
    box-shadow:0 0 0 4px var(--ink), 0 8px 0 4px var(--ink), 0 18px 34px rgba(0,0,0,.25);
  }
  #help {
    margin:6px 0 0; text-align:center; font-size:14px; color:#fff;
    paint-order:stroke fill; -webkit-text-stroke:4px var(--ink);
  }
  #pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,60px); gap:10px; }
  #pad button {
    font-size:24px; border:3px solid var(--ink); border-radius:18px; background:#fff; color:var(--ink);
    box-shadow:0 5px 0 var(--ink); touch-action:manipulation; font-family:inherit; cursor:pointer;
  }
  #pad button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); background:var(--yellow); }
  #pad .up { grid-column:2; } #pad .l { grid-row:2; grid-column:1; } #pad .d { grid-row:2; grid-column:2; } #pad .r { grid-row:2; grid-column:3; }
</style>
</head>
<body>
<div id="info">
  <div class="pill score">🍎 <span id="score">0</span></div>
  <div class="pill"><small>최고</small> 🏆 <span id="best">0</span></div>
  <button id="pauseBtn" aria-label="일시정지">⏸</button>
</div>
<canvas id="c"></canvas>
<p id="help"><span class="pc">방향키·WASD 이동 · 스페이스 시작 · P 멈춤</span><span class="touch">화면을 밀거나 버튼을 눌러 이동</span></p>
<div id="pad">
  <button class="up" data-k="ArrowUp">▲</button>
  <button class="l" data-k="ArrowLeft">◀</button>
  <button class="d" data-k="ArrowDown">▼</button>
  <button class="r" data-k="ArrowRight">▶</button>
</div>
<script>
const canvas = document.getElementById('c');
// 저장소 접근이 막힌 환경(아이폰 비공개 모드, 쿠키 차단)에서는 localStorage 를 읽기만 해도 예외가 난다.
// 그래도 게임은 되어야 하니 모든 접근을 감싼다 (기록만 저장되지 않는다)
const safeStore = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
const ctx = canvas.getContext('2d');
const SIZE = 400, N = 20, S = SIZE / N;
const INK = '#2b1d52';
const FONT = '"Jua", "Apple SD Gothic Neo", sans-serif';
// 기기에 맞는 안내만 (폰은 손가락, PC는 키보드)
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
// 선명하게: 화면 배율만큼 크게 그리고 줄여 보여준다
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = canvas.height = SIZE * dpr;
ctx.scale(dpr, dpr);

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
let best = +safeStore.get('wormBest') || 0;
bestEl.textContent = best;

let worm, dir, food, score, timer, state = 'ready', newBest = false;
let turns = [];          // 다음 칸들에서 꺾을 방향 (빠르게 두 번 꺾어도 둘 다 먹게 두 개까지)

function reset() {
  worm = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; turns = [];
  score = 0; scoreEl.textContent = 0;
  newBest = false;
  placeFood();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (worm.some(s => s.x===food.x && s.y===food.y));
}
const speedMs = () => Math.max(60, 130 - score * 3);
function start() {
  reset(); state = 'play';
  clearInterval(timer); timer = setInterval(step, speedMs());
}
// 다른 앱·탭에 갔다 오면 멈춰 있게. 다시 탭하거나 스페이스·P 로 이어서
function pause() {
  if (state !== 'play') return;
  state = 'pause'; clearInterval(timer);
}
function resume() {
  if (state !== 'pause') return;
  state = 'play'; clearInterval(timer); timer = setInterval(step, speedMs());
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause);
function step() {
  if (turns.length) dir = turns.shift();
  const h = {x:worm[0].x+dir.x, y:worm[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N || worm.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  worm.unshift(h);
  if (h.x===food.x && h.y===food.y) {
    score++; scoreEl.textContent = score; placeFood();
    clearInterval(timer); timer = setInterval(step, speedMs());
  } else worm.pop();
}
function gameOver() {
  clearInterval(timer); state = 'over';
  if (score > best) { best = score; newBest = true; safeStore.set('wormBest', best); bestEl.textContent = best; }
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function label(msg, x, y, size, fill = '#fff') {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.22);
  ctx.strokeStyle = INK;
  ctx.strokeText(msg, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(msg, x, y);
}
// 흰 판 + 테두리 + 그림자 (시작·게임 오버 안내)
function card(x, y, w, h, fill = '#fff') {
  ctx.fillStyle = INK; roundRect(x, y + 6, w, h, 20); ctx.fill();
  ctx.fillStyle = fill; roundRect(x, y, w, h, 20); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
}

function drawBoard() {
  // 잔디 체크무늬
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#8ee06a' : '#a3ea7e';
    ctx.fillRect(x * S, y * S, S, S);
  }
}

// 지렁이: 마디를 둥글게 이어 그린다. 테두리 먼저, 그 위에 분홍 몸통
function drawWorm(t) {
  const pts = worm.map((s) => [s.x * S + S / 2, s.y * S + S / 2]);
  const r = (i) => S * (0.46 - Math.min(0.14, (i / Math.max(1, worm.length - 1)) * 0.14));   // 꼬리로 갈수록 가늘게
  for (const pass of [0, 1]) {
    for (let i = pts.length - 1; i >= 0; i--) {
      const [x, y] = pts[i];
      ctx.fillStyle = pass ? (i % 4 === 2 ? '#ff7aa0' : '#ff9fbd') : INK;
      ctx.beginPath(); ctx.arc(x, y, r(i) + (pass ? 0 : 3), 0, Math.PI * 2); ctx.fill();
      if (i > 0) {
        // 이웃 마디 사이를 메운다
        const [px, py] = pts[i - 1];
        const rr = Math.min(r(i), r(i - 1)) + (pass ? 0 : 3);
        ctx.fillStyle = pass ? '#ff9fbd' : INK;
        if (px === x) ctx.fillRect(x - rr, Math.min(y, py), rr * 2, Math.abs(py - y));
        else ctx.fillRect(Math.min(x, px), y - rr, Math.abs(px - x), rr * 2);
      }
    }
  }
  // 등의 반짝임
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (let i = 1; i < pts.length; i += 2) {
    const [x, y] = pts[i];
    ctx.beginPath(); ctx.arc(x - 3, y - 4, r(i) * 0.28, 0, Math.PI * 2); ctx.fill();
  }
  // 머리: 가는 방향을 보는 눈, 볼터치
  const [hx, hy] = pts[0];
  const ex = dir.x * 3, ey = dir.y * 3;
  const side = [-dir.y, dir.x];
  for (const k of [-1, 1]) {
    const cx = hx + side[0] * 5 * k + dir.x * 2, cy = hy + side[1] * 5 * k + dir.y * 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(cx + ex * 0.5, cy + ey * 0.5, 2.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,90,140,.55)';
  for (const k of [-1, 1]) {
    ctx.beginPath(); ctx.arc(hx + side[0] * 7 * k - dir.x * 3, hy + side[1] * 7 * k - dir.y * 3, 2.4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawFood(t) {
  const x = food.x * S + S / 2, y = food.y * S + S / 2;
  const bob = Math.sin(t * 6) * 2;
  ctx.fillStyle = 'rgba(43,29,82,.25)';
  ctx.beginPath(); ctx.ellipse(x, y + S * 0.38, S * 0.32 - bob * 0.5, S * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.font = `${S * 0.95}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🍎', x, y - 2 + bob);
}

function draw(now) {
  const t = now / 1000;
  drawBoard();
  if (!worm) {
    card(60, 120, 280, 160);
    label('🐛 지렁이', 200, 172, 44, '#ff9fbd');
    ctx.fillStyle = INK; ctx.font = `17px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillText('사과를 먹고 쑥쑥 길어지기!', 200, 218);
    const s = 1 + Math.sin(t * 5) * 0.04;
    ctx.save(); ctx.translate(200, 252); ctx.scale(s, s);
    label(TOUCH ? '화면을 탭해서 시작' : '방향키나 스페이스바로 시작', 0, 0, 16, '#ffd23f');
    ctx.restore();
  } else {
    drawFood(t);
    drawWorm(t);
    if (state === 'over') {
      ctx.fillStyle = 'rgba(43,29,82,.45)'; ctx.fillRect(0, 0, SIZE, SIZE);
      card(70, 110, 260, 180);
      label('게임 오버', 200, 150, 38, '#ff5fa2');
      label(`🍎 ${score}`, 200, 202, 40, '#ffd23f');
      ctx.fillStyle = INK; ctx.font = `16px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(newBest ? '🏆 새 최고 기록!' : `최고 기록 ${best}`, 200, 240);
      ctx.fillStyle = '#6b5c95';
      ctx.fillText(TOUCH ? '탭해서 다시' : '스페이스바로 다시', 200, 266);
    } else if (state === 'pause') {
      ctx.fillStyle = 'rgba(43,29,82,.45)'; ctx.fillRect(0, 0, SIZE, SIZE);
      card(80, 130, 240, 140);
      label('일시정지', 200, 175, 38, '#ffd23f');
      ctx.fillStyle = '#6b5c95'; ctx.font = `16px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(TOUCH ? '탭해서 계속' : '스페이스바 · P로 계속', 200, 230);
    }
  }
  requestAnimationFrame(draw);
}

function turn(x, y) {
  if (state !== 'play') return;
  const last = turns.length ? turns[turns.length - 1] : dir;
  if ((x === last.x && y === last.y) || (x === -last.x && y === -last.y)) return;   // 같은 방향·뒤로 돌기는 무시
  if (turns.length < 2) turns.push({x, y});
}
// 누르면 시작/이어서, 게임 중이면 그 방향으로
function act(k) {
  if (state === 'pause') { resume(); return; }
  if (state !== 'play') start();
  if (k) turn(...k);
}
// 키보드 배치 기준(e.code)으로 받는다: 한글 입력 상태나 Caps Lock 이어도 WASD 가 먹는다
const keys = {ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); state === 'pause' ? resume() : pause(); return; }
  if (e.code === 'Space') { e.preventDefault(); act(null); return; }
  const k = keys[e.code]; if (k) { e.preventDefault(); act(k); }
});
// 스와이프: 손가락을 떼기 전에, 18px 밀리는 순간 바로 꺾는다. 이어서 다른 쪽으로 밀면 또 꺾는다
let sx = null, sy = 0;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  sx = e.clientX; sy = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  if (state !== 'play') act(null);
});
canvas.addEventListener('pointermove', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  sx = e.clientX; sy = e.clientY;
});
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { sx = null; });
const keyOf = {ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight'};
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); act(keys[keyOf[b.dataset.k]]);
}));
document.getElementById('pauseBtn').addEventListener('pointerdown', e => {
  e.preventDefault(); state === 'pause' ? resume() : pause();
});
requestAnimationFrame(draw);
</script>
</body>
</html>
